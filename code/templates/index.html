<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>智能停车场 - 登录/注册</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }

        .viewport-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pc-mode {
            background: #ffffff;
            padding: 40px 48px;
            border-radius: 24px;
            width: 360px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .apple-btn {
            background: #0071e3 !important;
            border: none !important;
            border-radius: 12px !important;
            font-weight: 500 !important;
            width: 100%;
            height: 44px;
            font-size: 16px !important;
            margin-top: 10px;
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>
<body>
<div id="app" class="viewport-wrapper" v-cloak>
    <div class="pc-mode">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="el-icon-odometer" style="font-size: 48px; color: #0071e3; margin-bottom: 15px;"></i>
            <h2 style="margin: 0; font-weight: 600;">智能停车系统</h2>
        </div>
        {% raw %}
        <el-tabs v-model="activeTab">
            <el-tab-pane label="系统登录" name="login">
                <el-form size="medium" @submit.native.prevent>
                    <el-form-item>
                        <el-input prefix-icon="el-icon-mobile-phone" v-model="loginForm.phone"
                                  placeholder="手机号或内部编号" @keyup.enter.native="handleLogin"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-input prefix-icon="el-icon-lock" v-model="loginForm.password" type="password"
                                  placeholder="密码" @keyup.enter.native="handleLogin" show-password></el-input>
                    </el-form-item>
                    <el-button type="primary" class="apple-btn" :loading="loading" @click="handleLogin">登 录
                    </el-button>
                </el-form>
            </el-tab-pane>

            <el-tab-pane label="用户注册" name="register">
                <el-form size="medium" @submit.native.prevent>
                    <el-form-item>
                        <el-input prefix-icon="el-icon-user" v-model="regForm.username"
                                  placeholder="真实姓名"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-input prefix-icon="el-icon-mobile-phone" v-model="regForm.phone"
                                  placeholder="手机号"></el-input>
                    </el-form-item>

                    <el-form-item>
                        <el-input prefix-icon="el-icon-truck" v-model="regForm.plate" @input="formatRegPlate"
                                  placeholder="车牌号 (如 京A88888)"></el-input>
                    </el-form-item>

                    <el-form-item>
                        <el-input prefix-icon="el-icon-lock" v-model="regForm.password" type="password"
                                  placeholder="设置密码" show-password></el-input>
                    </el-form-item>
                    <el-button type="primary" class="apple-btn" :loading="loading" @click="handleRegister">
                        提交注册申请
                    </el-button>
                </el-form>
            </el-tab-pane>
        </el-tabs>
        {% endraw %}
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            activeTab: 'login', loading: false,
            loginForm: {phone: '', password: ''},
            regForm: {username: '', phone: '', plate: '', password: ''}
        },
        methods: {
            // 🌟 注册时的前端格式化：自动加点和变大写
            formatRegPlate(val) {
                let clean = val.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
                if (clean.length > 2) {
                    this.regForm.plate = clean.slice(0, 2) + '·' + clean.slice(2).toUpperCase();
                } else {
                    this.regForm.plate = clean.toUpperCase();
                }
            },

            handleLogin() {
                if (!this.loginForm.phone || !this.loginForm.password) return this.$message.warning("请输入账号和密码");
                this.loading = true;
                axios.post('/api/user/login', this.loginForm).then(res => {
                    this.loading = false;
                    if (res.data.code === 200) {
                        this.$message.success('验证成功');
                        localStorage.setItem('userInfo', JSON.stringify(res.data.data));

                        setTimeout(() => {
                            const role = res.data.data.role;
                            if (['admin', 'manager', 'security'].includes(role)) {
                                window.location.href = '/admin';
                            } else if (role === 'simulator') {
                                window.location.href = '/simulator';
                            } else {
                                window.location.href = '/user';
                            }
                        }, 500);
                    }
                    // 🌟 拦截待审批的用户
                    else if (res.data.code === 403) {
                        this.$message.warning(res.data.msg);
                    } else {
                        this.$message.error(res.data.msg);
                    }
                }).catch(err => {
                    this.loading = false;
                    this.$message.error("网络异常");
                });
            },

            handleRegister() {
                if (!this.regForm.username || !this.regForm.phone || !this.regForm.password || !this.regForm.plate) {
                    this.$message.warning("请填写完整的注册信息");
                    return;
                }
                this.loading = true;
                axios.post('/api/user/register', this.regForm).then(res => {
                    this.loading = false;
                    if (res.data.code === 200) {
                        this.$message.success(res.data.msg);
                        this.activeTab = 'login';
                        this.loginForm.phone = this.regForm.phone;
                        this.loginForm.password = this.regForm.password;
                    } else {
                        this.$message.error(res.data.msg);
                    }
                }).catch(err => {
                    this.loading = false;
                    this.$message.error("网络异常");
                });
            }
        }
    });
</script>
</body>
</html>
